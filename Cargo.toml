[workspace]
resolver = "2"
members = [
    "crates/portglass-proto",
    "crates/portglass-core",
    "crates/portglass-probe",
    "crates/portglass-controller",
    "crates/portglass-mock-target",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Joseph Spillers"]
repository = "https://github.com/spilloid/portGlass"
rust-version = "1.85"

[workspace.dependencies]
portglass-proto = { path = "crates/portglass-proto" }
portglass-core = { path = "crates/portglass-core" }
portglass-probe = { path = "crates/portglass-probe" }
portglass-controller = { path = "crates/portglass-controller" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pemfile = "2"
rcgen = "0.13"
ring = "0.17"
hex = "0.4"
ipnet = "2"
time = { version = "0.3", features = ["formatting"] }
axum = { version = "0.8", features = ["ws"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
