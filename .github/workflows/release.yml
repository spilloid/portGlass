name: Release Builds

# Builds, signs, verifies and publishes the Windows release when a GitHub release is published.
# Never publishes unsigned binaries: missing signing configuration fails the run before building.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build, sign, package (windows-x64)
    runs-on: windows-latest
    # The federated credential trusts this repository's `release` environment.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Check release tag and signing configuration
        id: meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $tag) { throw "Cargo.toml version v$version does not match the tag $tag" }
          $missing = @('SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE',
                       'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Code signing is not configured; missing: $($missing -join ', '). " +
                  'Set them under Settings > Environments > release (see docs/deployment.md#code-signing). ' +
                  'Releases are never published unsigned.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=dist/portglass-$tag-windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --workspace

      - name: Build binaries
        shell: pwsh
        run: ./scripts/build.ps1 -Release -Stage build -Tag ${{ steps.meta.outputs.tag }}

      - name: Sign and verify binaries
        uses: ./.github/actions/sign-release
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          account: ${{ vars.SIGNING_ACCOUNT }}
          profile: ${{ vars.SIGNING_PROFILE }}
          expected-subject: ${{ vars.SIGNING_EXPECTED_SUBJECT }}

      - name: Package signed release
        shell: pwsh
        run: ./scripts/build.ps1 -Release -Stage package -Tag ${{ steps.meta.outputs.tag }}

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          # The raw signed binaries too: installed copies update from these (see the manifest job).
          $v = $env:TAG.TrimStart('v')
          $raw = foreach ($p in 'portglass', 'portglass-probe', 'portglass-relay') {
            $name = "dist/$p-v$v-windows-x64.exe"
            Copy-Item "dist/$p.exe" $name
            $name
          }
          gh release upload $env:TAG $env:ASSET "$($env:ASSET).sha256" @raw --clobber
      - name: Keep the raw binaries for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: raw-windows-x64
          path: dist/*-windows-x64.exe
          if-no-files-found: error

  # The macOS controller (Apple silicon). Not code-signed or notarized yet: macOS asks the
  # first time it is opened (see README). The Windows job above is unaffected by this one.
  macos:
    name: Build, package (macos-arm64 controller)
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.+)"/\1/')
          [ "v$version" = "$TAG" ] || { echo "Cargo.toml v$version does not match $TAG"; exit 1; }
      - name: Test
        run: |
          rustup target add "$TARGET"
          cargo test --workspace --target "$TARGET"
      - name: Build and package
        run: |
          cargo build --release --target "$TARGET" -p portglass-controller
          mkdir -p dist/portglass
          cp "target/$TARGET/release/portglass" README.md LICENSE CHANGELOG.md SECURITY.md dist/portglass/
          cp "target/$TARGET/release/portglass" "dist/portglass-$TAG-macos-arm64"
          echo "RAW=dist/portglass-$TAG-macos-arm64" >> "$GITHUB_ENV"
          asset="portglass-$TAG-macos-arm64.tar.gz"
          tar -C dist -czf "dist/$asset" portglass
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          echo "ASSET=dist/$asset" >> "$GITHUB_ENV"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber "$RAW"
      - name: Keep the raw binaries for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: raw-macos-arm64
          path: ${{ env.RAW }}
          if-no-files-found: error
  # The relay, for a Linux server both sides can reach (a small VPS is enough). A static musl
  # binary, so it runs on any distribution. Not code-signed: Linux has no Authenticode; verify it
  # with the published SHA-256.
  linux-relay:
    name: Build, package (linux-x64 relay)
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.+)"/\1/')
          [ "v$version" = "$TAG" ] || { echo "Cargo.toml v$version does not match $TAG"; exit 1; }
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add "$TARGET"
          cargo test --target "$TARGET" -p portglass-proto -p portglass-core -p portglass-relay
      - name: Build and package
        run: |
          cargo build --release --target "$TARGET" -p portglass-relay
          mkdir -p dist/portglass-relay
          cp "target/$TARGET/release/portglass-relay" README.md LICENSE CHANGELOG.md SECURITY.md \
             docs/relay.md examples/relay.toml examples/portglass-relay.service dist/portglass-relay/
          cp "target/$TARGET/release/portglass-relay" "dist/portglass-relay-$TAG-linux-x64"
          echo "RAW=dist/portglass-relay-$TAG-linux-x64" >> "$GITHUB_ENV"
          asset="portglass-relay-$TAG-linux-x64.tar.gz"
          tar -C dist -czf "dist/$asset" portglass-relay
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          echo "ASSET=dist/$asset" >> "$GITHUB_ENV"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber "$RAW"
      - name: Keep the raw binaries for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: raw-linux-x64
          path: ${{ env.RAW }}
          if-no-files-found: error

  # Last: the signed manifest installed copies trust for updates. Runs only when every platform
  # job succeeded, so a release missing a platform never offers itself as an update. The manifest
  # is verified with the public keys compiled into this very release before it is uploaded.
  manifest:
    name: Sign the update manifest
    needs: [build, macos, linux-relay]
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      # Sign what this run built, never what is in the release: release assets can be replaced
      # by anyone who can edit the release, run artifacts cannot.
      - name: Collect this run's raw binaries
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          merge-multiple: true
          path: manifest
      - name: Build, sign and verify the manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "UPDATE_SIGNING_KEY is not set in the release environment; releases are never unsigned"; exit 1; }
          cargo run --release -q --target x86_64-unknown-linux-gnu -p portglass-release -- manifest --version "${TAG#v}" --dir manifest
          cargo run --release -q --target x86_64-unknown-linux-gnu -p portglass-release -- sign --dir manifest
          cargo run --release -q --target x86_64-unknown-linux-gnu -p portglass-release -- verify --dir manifest
      - name: Check the published binaries against the signed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p released
          gh release download "$TAG" --dir released --pattern "*-$TAG-*-x64*" --pattern "*-$TAG-macos-arm64"
          rm -f released/*.zip released/*.tar.gz released/*.sha256
          cp manifest/portglass-manifest.json manifest/portglass-manifest.json.sig released/
          cargo run --release -q --target x86_64-unknown-linux-gnu -p portglass-release -- verify --dir released
      # Published last, so clients never see an update whose files fail the check above.
      - name: Upload the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" manifest/portglass-manifest.json manifest/portglass-manifest.json.sig --clobber
