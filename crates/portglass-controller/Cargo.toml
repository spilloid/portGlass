[package]
name = "portglass-controller"
description = "PortGlass Controller: opens an authorized remote web interface in a dedicated, isolated browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "portglass"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
hex.workspace = true
axum.workspace = true
portglass-proto.workspace = true
portglass-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
portglass-probe.workspace = true
portglass-relay.workspace = true
portglass-mock-target = { path = "../portglass-mock-target" }
tokio-tungstenite = "0.30"
tempfile = "3"

[build-dependencies]
winresource = "0.1"
