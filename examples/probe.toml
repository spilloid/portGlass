# Example PortGlass Probe configuration. Fingerprints and addresses are fictional.
# Create a real one with `portglass-probe init`; it generates the identity too.

[probe]
name = "front-office"
listen = "0.0.0.0:47100"        # restrict with Windows Firewall to technician addresses
identity_dir = "identity"       # probe.crt / probe.key, relative to this file
audit_log = "audit.jsonl"

[limits]
max_session_ttl_secs = 14400    # 4 hours; a controller may ask for less, never more
max_streams_per_session = 32    # Chrome opens ~6 per host; WebSockets hold one each
max_sessions = 4
stream_idle_timeout_secs = 300
connect_timeout_secs = 5
control_timeout_secs = 30       # silent controllers are dropped and their sessions revoked

[[controller]]
name = "alice"
fingerprint = "sha256:0000:1111:2222:3333:4444:5555:6666:7777:8888:9999:AAAA:BBBB:CCCC:DDDD:EEEE:FFFF"

[[allow]]
network = "192.168.1.50"
ports = [80, 443]
label = "Front office printer"

[[allow]]
network = "192.168.1.60"
ports = ["8080-8081"]
label = "Badge printer admin"
